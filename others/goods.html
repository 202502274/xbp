<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>グッズ管理アプリ</title>
    <link rel="stylesheet" href="goods.css">
</head>
<body>

<!-- ===== ① タブ付きナビバー ===== -->
<header class="navbar">
  <div class="nav-container">
    <p class="logo">🎁 グッズ管理アプリ</p>
    <input type="checkbox" id="menu-btn-check" class="menu-btn-check">
    <label for="menu-btn-check" class="menu-btn"><span></span></label>
    <ul class="nav-menu">
      <li><a href="#" id="tab-register" class="active" onclick="switchView('register')">登録</a></li>
      <li><a href="#" id="tab-events" onclick="switchView('events')">イベント一覧</a></li>
      <li><a href="#" id="tab-goods" onclick="switchView('goods')">グッズ一覧</a></li>
      <li><a href="calendar.html">カレンダー</a></li>
    </ul>
  </div>
</header>

<!-- ===== メインコンテンツ ===== -->
<main>
    <!-- 【登録画面】 -->
    <div id="view-register" class="view-section">
        <div class="app-layout" style="grid-template-columns: 1fr 1fr;">
            <div class="box">
                <h2>① イベントを追加</h2>
                <div class="form-group">
                    <label>イベント名</label>
                    <input type="text" id="event-name" placeholder="例: 夏フェス 2026">
                </div>
                <div class="form-group">
                    <label>開催日・参戦日</label>
                    <input type="date" id="event-date">
                </div>
                <button onclick="createNewEvent()">イベント作成</button>
            </div>

            <div class="box">
                <h2>② グッズを登録</h2>
                <div class="form-group">
                    <label>追加先のイベントを選択</label>
                    <select id="select-target-event"></select>
                </div>
                <div class="form-group">
                    <label>グッズ名 (シリーズ名など)</label>
                    <input type="text" id="goods-name" placeholder="例: トレーディング缶バッジ">
                </div>
                <div class="form-group">
                    <label>単価 (円)</label>
                    <input type="number" id="goods-price" placeholder="例: 500" value="0">
                </div>
                <div class="form-group">
                    <label>初期の写真（後から種類ごとに追加可）</label>
                    <input type="file" id="goods-image" accept="image/*">
                </div>
                <button onclick="addGoods()" class="accent">イベントにグッズを追加</button>
            </div>
        </div>
    </div>

    <!-- 【イベント一覧・グッズ一覧の共通表示エリア】 -->
    <div id="view-display-container" class="view-section" style="display:none;">
        <div class="app-layout">
            <!-- 左側：イベント一覧選択メニュー（イベント一覧モードの時だけ表示） -->
            <div class="sidebar" id="event-sidebar">
                <div class="box">
                    <h2>📅 イベントを選択</h2>
                    <ul class="link-list" id="event-list-display"></ul>
                </div>
            </div>
            <!-- 右側：メイン表示部分 -->
            <div class="main-content-area">
                <div class="box" id="main-display"></div>
            </div>
        </div>
    </div>
</main>

<!-- ===== グッズ編集モーダル ===== -->
<div id="edit-modal" class="modal">
    <div class="modal-content" style="max-width: 500px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin: 0 0 15px 0;">
            <h3>✏️ グッズの編集・種類追加</h3>
            <button onclick="deleteItemDirect()" style="width: auto; padding: 4px 10px; background: #cc6666; font-size: 0.8rem;">⚠️ 全削除</button>
        </div>
        <input type="hidden" id="edit-item-id">
        <div class="form-group"><label>グッズ名</label><input type="text" id="edit-goods-name"></div>
        <div class="form-group"><label>単価 (円)</label><input type="number" id="edit-goods-price"></div>
        <button onclick="saveGoodsEdit()" style="margin-bottom: 20px;">基本情報を保存</button>

        <h4 style="margin: 15px 0 5px 0; border-left: 4px solid #288b42; padding-left: 8px;">🎨 種類の追加管理</h4>
        <div style="background: #f8fff9; padding: 10px; border-radius: 6px; border: 1px solid #e3f2e8; margin: 0 0 15px 0;">
            <div class="form-group"><label>種類名</label><input type="text" id="new-variant-name" placeholder="例: キャラA"></div>
            <div class="form-group"><label>写真</label><input type="file" id="new-variant-image" accept="image/*"></div>
            <button onclick="addVariant()" class="accent" style="padding: 6px; font-size: 0.85rem;">種類を追加する</button>
        </div>
        <ul id="variant-manage-list" style="max-height: 150px; overflow-y: auto; padding-left: 0; list-style: none;"></ul>
        <button onclick="closeEditModal()" class="accent" style="margin-top: 15px; background-color: #666;">閉じる</button>
    </div>
</div>

<footer><p>&copy; 2026 グッズ管理アプリ</p></footer>
<script src="goods.js"></script>
</body>
</html>
